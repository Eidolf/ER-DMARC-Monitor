name: Build and Publish Docker Images

on:
  workflow_dispatch: # Manual trigger
  push:
    tags:
      - 'v*.*.*' # Release / version tag

env:
  REGISTRY: ghcr.io
  ACT: "false"
  REPO: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: api
            context: .
            file: ./api/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: smtp-ingester
            context: ./smtp-ingester
            file: ./smtp-ingester/Dockerfile
          - name: dmarc-parser
            context: ./dmarc-parser
            file: ./dmarc-parser/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only when not running locally via act (act uses ACT=true env var)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        if: ${{ env.ACT != 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        env:
          GITHUB_TOKEN: ${{ env.ACT == 'true' && '' || secrets.GITHUB_TOKEN }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}-${{ matrix.component.name }}

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref_type == 'tag' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.file }}
          # Push only if not running locally via act
          push: ${{ env.ACT != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
