name: Generate Documentation Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'project_manifest.json'
      - 'scripts/generate-docs-images.py'
  pull_request:
    branches:
      - main
    paths:
      - 'project_manifest.json'
      - 'scripts/generate-docs-images.py'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate all images even if unchanged'
        required: false
        default: false
        type: boolean

concurrency:
  group: generate-docs-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install graphviz pillow
          
          # Install graphviz system package (required by graphviz Python module)
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Generate documentation images
        run: |
          python scripts/generate-docs-images.py
        env:
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || 'false' }}

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain docs/generated/images/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in generated images"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in generated images"
            git diff --stat docs/generated/images/ || true
          fi

      - name: Commit and push changes (if on main branch and changes exist)
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/generated/images/
          git commit -m "🔄 Update auto-generated documentation images [skip ci]"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-images
          path: docs/generated/images/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## 📊 Documentation Image Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Artifacts:" >> $GITHUB_STEP_SUMMARY
          if [ -d "docs/generated/images" ]; then
            ls -lh docs/generated/images/ | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs:" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture diagram: \`docs/generated/images/architecture-diagram.svg\`" >> $GITHUB_STEP_SUMMARY
          echo "- Database schema: \`docs/generated/images/database-schema.svg\`" >> $GITHUB_STEP_SUMMARY
          echo "- API endpoints: \`docs/generated/images/api-endpoints.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "- Metadata badge: \`docs/generated/images/metadata-badge.png\`" >> $GITHUB_STEP_SUMMARY
