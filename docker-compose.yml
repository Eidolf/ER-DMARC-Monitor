services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dmarc_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_dmarc_pass}
      - POSTGRES_DB=${POSTGRES_DB:-dmarc_monitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dmarc-backend

  redis:
    image: redis:alpine
    networks:
      - dmarc-backend

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ghcr.io/eidolf/er-dmarc-monitor-api:latest
    environment:
      - DB_DSN=postgresql+psycopg://${POSTGRES_USER:-dmarc_admin}:${POSTGRES_PASSWORD:-secure_dmarc_pass}@postgres:5432/${POSTGRES_DB:-dmarc_monitor}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "13061:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - dmarc-backend
      - dmarc-frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/eidolf/er-dmarc-monitor-frontend:latest
    ports:
      - "13060:80"
    networks:
      - dmarc-frontend

  smtp-ingester:
    build:
      context: ./smtp-ingester
      dockerfile: Dockerfile
    image: ghcr.io/eidolf/er-dmarc-monitor-smtp-ingester:latest
    environment:
      - BROKER_URL=redis://redis:6379/0
      - RECIPIENT_DOMAINS=${RECIPIENT_DOMAINS:-report.dmarc.domain.com}
    ports:
      - "13062:2525"
    volumes:
      - raw-payloads:/data/raw
    networks:
      - dmarc-backend

  dmarc-parser:
    build:
      context: ./dmarc-parser
      dockerfile: Dockerfile
    image: ghcr.io/eidolf/er-dmarc-monitor-dmarc-parser:latest
    environment:
      - BROKER_URL=redis://redis:6379/0
      - DB_DSN=postgresql+psycopg://${POSTGRES_USER:-dmarc_admin}:${POSTGRES_PASSWORD:-secure_dmarc_pass}@postgres:5432/${POSTGRES_DB:-dmarc_monitor}
    depends_on:
      - postgres
      - redis
    volumes:
      - raw-payloads:/data/raw
    networks:
      - dmarc-backend

networks:
  dmarc-backend:
    driver: bridge
  dmarc-frontend:
    driver: bridge

volumes:
  pgdata:
  raw-payloads:
