services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=dmarc_admin
      - POSTGRES_PASSWORD=secure_dmarc_pass
      - POSTGRES_DB=dmarc_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dmarc-backend

  redis:
    image: redis:alpine
    networks:
      - dmarc-backend

  api:
    build: ./api
    environment:
      - DB_DSN=postgresql+psycopg://dmarc_admin:secure_dmarc_pass@postgres:5432/dmarc_monitor
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=change_me_in_production
      - ADMIN_EMAIL=admin@local
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin123
      - ENTRA_CLIENT_ID=
      - ENTRA_CLIENT_SECRET=
      - ENTRA_TENANT_ID=common
      - ENTRA_REDIRECT_URI=http://localhost:13060/api/auth/sso/callback
      - FRONTEND_URL=http://localhost:13060
    ports:
      - "13061:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - dmarc-backend
      - dmarc-frontend

  frontend:
    build: ./frontend
    ports:
      - "13060:80"
    networks:
      - dmarc-frontend

  smtp-ingester:
    build: ./smtp-ingester
    environment:
      - BROKER_URL=redis://redis:6379/0
      - RECIPIENT_DOMAINS=report.dmarc.domain.com
    ports:
      - "13062:2525"
    volumes:
      - raw-payloads:/data/raw
    networks:
      - dmarc-backend

  dmarc-parser:
    build: ./dmarc-parser
    environment:
      - BROKER_URL=redis://redis:6379/0
      - DB_DSN=postgresql+psycopg://dmarc_admin:secure_dmarc_pass@postgres:5432/dmarc_monitor
    depends_on:
      - postgres
      - redis
    volumes:
      - raw-payloads:/data/raw
    networks:
      - dmarc-backend

networks:
  dmarc-backend:
    driver: bridge
  dmarc-frontend:
    driver: bridge

volumes:
  pgdata:
  raw-payloads:
